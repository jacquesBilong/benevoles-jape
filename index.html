<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Répertoire, programmes et documents de la chorale Les Bénévoles de la JAPE, EPC Paroisse La Grâce, Bruxelles : paroles des chants, note de départ par voix, déroulé des cultes et Guide du responsable.">
<meta name="theme-color" content="#0E5A3C">
<link rel="icon" href="images/g-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Les Bénévoles de la JAPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Alegreya+Sans:wght@400;500;700;800&family=Archivo:wght@700;800;900&display=swap">
<style>
/* Identité JAPE : vert et jaune du pagne de la couverture du Guide, rouge de la croix en touche ; fond blanc légèrement vert.
   Layout : un livret de chants d'une colonne — onglets Programmes / Répertoire, feuilles plein écran pour le détail, mode prestation en grand */
:root{
  --jape-g:#16835A; --jape-y:#F2CF1D; --jape-r:#D7261E; --pagne-op:.06; --hero:#0E5A3C; --hero-fg:#FFFFFF; --hero-acc:#F2CF1D; --bg:#F7F8F4; --surface:#FFFFFF; --sunk:#EDF1EA; --ink:#14201A; --muted:#55615A; --line:#DCE3DA;
  --navy:#0F6B47; --on-navy:#FFFFFF; --gold:#16835A; --gold-ink:#0D6040; --gold-soft:#E2F1E8; --hi:#FFF3B8;
  --danger:#B3261E; --danger-soft:#F9DEDB; --ok:#2E6B3F;
  --v-s:#C2416B; --v-a:#7A4BC2; --v-t:#2A72B8; --v-b:#2E7D5B; --v-x:#6E6A67;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.07);
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-head:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-ui:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --pagne-op:.05; --hero:#0B3D29; --hero-fg:#F2F6F1; --hero-acc:#F2CF1D; --bg:#0D1310; --surface:#151D18; --sunk:#101713; --ink:#ECF2EC; --muted:#9DAAA1; --line:#26332B;
  --navy:#3CC487; --on-navy:#0B1A12; --gold:#3CC487; --gold-ink:#6AD9A5; --gold-soft:#16301F; --hi:#3A3412;
  --danger:#F2867D; --danger-soft:#3E1B1A; --ok:#7FC491;
  --v-s:#EE7FA2; --v-a:#B18CF0; --v-t:#79B3EE; --v-b:#71C9A0; --v-x:#A9A3A0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --pagne-op:.05; --hero:#0B3D29; --hero-fg:#F2F6F1; --hero-acc:#F2CF1D; --bg:#0D1310; --surface:#151D18; --sunk:#101713; --ink:#ECF2EC; --muted:#9DAAA1; --line:#26332B;
  --navy:#3CC487; --on-navy:#0B1A12; --gold:#3CC487; --gold-ink:#6AD9A5; --gold-soft:#16301F; --hi:#3A3412;
  --danger:#F2867D; --danger-soft:#3E1B1A; --ok:#7FC491;
  --v-s:#EE7FA2; --v-a:#B18CF0; --v-t:#79B3EE; --v-b:#71C9A0; --v-x:#A9A3A0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{isolation:isolate;font-family:var(--f-ui);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 96px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2240%22%20height%3D%2269.282%22%20viewBox%3D%220%200%2040%2069.282%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%2316835A%22%20stroke-width%3D%222%22%3E%3Cpath%20d%3D%22M0%200H40M0%2034.641H40M0%2069.282H40M0%2034.641L20%200L40%2034.641L20%2069.282Z%22/%3E%3C/g%3E%3Cg%20fill%3D%22%23F2CF1D%22%3E%3Cpath%20d%3D%22M20%2015L27.5%2028H12.5Z%22/%3E%3Cpath%20d%3D%22M0%2049.6L7.5%2062.6H-7.5Z%22/%3E%3Cpath%20d%3D%22M40%2049.6L47.5%2062.6H32.5Z%22/%3E%3C/g%3E%3C/svg%3E") center top/48px auto repeat;opacity:var(--pagne-op);-webkit-mask-image:linear-gradient(180deg,#000 0,rgba(0,0,0,.55) 45%,rgba(0,0,0,.85) 100%);mask-image:linear-gradient(180deg,#000 0,rgba(0,0,0,.55) 45%,rgba(0,0,0,.85) 100%)}
.wrap{max-width:760px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.15}

/* En-tête */
.top{padding-block:18px 8px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.top .logo{width:56px;height:auto;background:#fff;border-radius:8px;padding:4px;border:1px solid var(--line);display:block}
.top .tt{display:flex;flex-direction:column;gap:2px;min-width:0}
.pagne{height:22px;margin-inline:-16px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2240%22%20height%3D%2269.282%22%20viewBox%3D%220%200%2040%2069.282%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%2316835A%22%20stroke-width%3D%222%22%3E%3Cpath%20d%3D%22M0%200H40M0%2034.641H40M0%2069.282H40M0%2034.641L20%200L40%2034.641L20%2069.282Z%22/%3E%3C/g%3E%3Cg%20fill%3D%22%23F2CF1D%22%3E%3Cpath%20d%3D%22M20%2015L27.5%2028H12.5Z%22/%3E%3Cpath%20d%3D%22M0%2049.6L7.5%2062.6H-7.5Z%22/%3E%3Cpath%20d%3D%22M40%2049.6L47.5%2062.6H32.5Z%22/%3E%3C/g%3E%3C/svg%3E") left center/26px auto repeat-x,#fff;border-bottom:3px solid var(--jape-g)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);font-weight:700}
.top h1{font-size:clamp(26px,6.5vw,40px);font-weight:900;text-transform:uppercase;letter-spacing:.01em;line-height:1.05}
.top h1 em{font-style:normal;font-weight:900;color:var(--gold)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;border-bottom:1px solid var(--line);margin-block:12px 16px}
.tab{background:none;border:0;padding:12px 10px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;font-size:16px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.datebox .d,.title-xl,.perf .ptitle{font-family:var(--f-head)}
.tab .n{font-weight:500;color:var(--muted);font-size:13px;margin-left:4px;font-variant-numeric:tabular-nums}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 18px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-size:15px;text-decoration:none;color:var(--ink);min-height:42px}
.btn.primary{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg,.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab .btn{box-shadow:var(--shadow)}

/* Listes */
.section-label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-block:20px 8px}
.list{display:flex;flex-direction:column;gap:10px}
.prog{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.prog.past{opacity:.72}
.datebox{text-align:center;border-right:1px solid var(--line);padding-right:12px}
.datebox .d{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.datebox .m{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold-ink);font-weight:700}
.prog h3{font-size:19px}
.meta{color:var(--muted);font-size:14px}
.chev{color:var(--muted)}
.chant-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.thumb{width:52px;height:64px;border-radius:6px;background:var(--sunk);object-fit:cover;display:grid;place-items:center;color:var(--muted);overflow:hidden}
.thumb.tx{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--gold-ink);background:var(--gold-soft);display:grid;place-items:center;height:52px;border-radius:50%}
.hero{background:var(--hero);color:var(--hero-fg);border-radius:18px;overflow:hidden;margin-bottom:6px;border:1px solid var(--line)}
.hero .hz{height:18px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2240%22%20height%3D%2269.282%22%20viewBox%3D%220%200%2040%2069.282%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%2316835A%22%20stroke-width%3D%222%22%3E%3Cpath%20d%3D%22M0%200H40M0%2034.641H40M0%2069.282H40M0%2034.641L20%200L40%2034.641L20%2069.282Z%22/%3E%3C/g%3E%3Cg%20fill%3D%22%23F2CF1D%22%3E%3Cpath%20d%3D%22M20%2015L27.5%2028H12.5Z%22/%3E%3Cpath%20d%3D%22M0%2049.6L7.5%2062.6H-7.5Z%22/%3E%3Cpath%20d%3D%22M40%2049.6L47.5%2062.6H32.5Z%22/%3E%3C/g%3E%3C/svg%3E") left center/22px auto repeat-x,#fff}
.hero .hb{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px}
.hero .ey{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--hero-acc)}
.hero h2{font-family:var(--f-head);font-size:clamp(24px,6vw,32px);font-weight:900;color:var(--hero-fg)}
.hero .hm{color:var(--hero-fg);opacity:.78;font-size:15px}
.hero .when{display:inline-block;align-self:flex-start;background:var(--hero-acc);color:#fff;font-weight:800;border-radius:999px;padding:2px 10px;font-size:13px}
.hero .btn.hg{background:transparent;color:var(--hero-fg);border-color:rgba(255,255,255,.35)}
.badge{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--gold);color:var(--gold-ink);border-radius:999px;padding:1px 7px;white-space:nowrap}
.badges{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.badge.soft{border-color:var(--line);color:var(--muted)}
.web-note{display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--gold);background:var(--surface);border-radius:var(--r);padding:12px 14px}
.web-note p{margin:0}
.book{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.cover{display:grid;grid-template-columns:14px 1fr;background:var(--hero);color:var(--hero-fg);border-radius:6px 16px 16px 6px;overflow:hidden;box-shadow:var(--shadow)}
.cover .spine{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2240%22%20height%3D%2269.282%22%20viewBox%3D%220%200%2040%2069.282%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%2316835A%22%20stroke-width%3D%222%22%3E%3Cpath%20d%3D%22M0%200H40M0%2034.641H40M0%2069.282H40M0%2034.641L20%200L40%2034.641L20%2069.282Z%22/%3E%3C/g%3E%3Cg%20fill%3D%22%23F2CF1D%22%3E%3Cpath%20d%3D%22M20%2015L27.5%2028H12.5Z%22/%3E%3Cpath%20d%3D%22M0%2049.6L7.5%2062.6H-7.5Z%22/%3E%3Cpath%20d%3D%22M40%2049.6L47.5%2062.6H32.5Z%22/%3E%3C/g%3E%3C/svg%3E") center top/24px auto repeat,#fff;border-right:3px solid var(--jape-g)}
.cover{grid-template-columns:44px 1fr!important}
.cover .cv{padding:18px 18px 20px;display:flex;flex-direction:column;gap:6px}
.cover .ey{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--hero-acc)}
.cover h2{font-family:var(--f-head);font-weight:900;font-size:clamp(22px,5.5vw,30px);color:var(--hero-fg);text-transform:uppercase}
.cover .cvm{font-size:14px;opacity:.8}
.tocs{display:flex;flex-direction:column}
.toc,.hit{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:baseline;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.hit{grid-template-columns:60px 1fr}
.toc{grid-template-columns:minmax(52px,auto) 1fr auto}
.toc .tl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc-sec{font-family:var(--f-head);font-weight:800;font-size:15px;margin-top:14px;padding-bottom:2px;color:var(--gold-ink);text-transform:uppercase;letter-spacing:.03em}
.pg{font-family:var(--f-head);font-weight:800;color:var(--gold-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pg.big{font-size:15px;background:var(--gold);color:#fff;border-radius:999px;padding:3px 12px}
.snip{font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.snip mark{background:var(--gold-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.hits{display:flex;flex-direction:column}
.page-read{max-width:68ch!important}
.pg-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btext{font-family:var(--f-display);font-size:19px;line-height:1.6;overflow-wrap:anywhere}
.btext p{margin:0 0 .8em}
.btext .bh{font-family:var(--f-head);font-size:20px;margin:1.1em 0 .5em;text-transform:none}
.btext .bh:first-child{margin-top:0}
.warn{display:flex;flex-direction:column;gap:2px;border:1px solid var(--gold);border-left-width:6px;background:var(--gold-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:15px}
.warn b{color:var(--gold-ink);text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.btab{overflow-x:auto;margin:0 0 1em;border:1px solid var(--line);border-radius:8px}
.btab table{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:14px;font-variant-numeric:tabular-nums}
.btab th,.btab td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;min-width:60px}
.btab th{background:var(--sunk);font-weight:800}
.btab tr:last-child td{border-bottom:0}
.btext .bl{margin:0 0 .9em;padding-left:1.2em}
.goto{display:flex;gap:6px;align-items:center}
.goto input{width:58px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--surface);text-align:center}
.pnav .goto{display:flex!important;flex-direction:row;flex-wrap:nowrap;align-items:center;justify-content:center;gap:6px}
.pnav .goto .btn{min-width:0}
@media (max-width:420px){.pnav .btn:not(.sm){min-width:0;padding-inline:12px}}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:6px}
.member{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.member:disabled{cursor:default;opacity:1}
.member .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-head);font-weight:800}
.member .min{display:flex;flex-direction:column;min-width:0}
.member .mc{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{overflow-x:auto;scrollbar-width:none}
.tab{white-space:nowrap;flex:1 0 auto;text-align:center}
@media (max-width:440px){.tab{font-size:15px;padding-inline:6px}.tab .n{display:none}}
.orig{border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px}
.orig summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:14px}
.orig .gallery{margin-top:10px}
.thumb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.chant-row h3{font-size:18px;font-weight:700}
.chant-row .min{min-width:0}
.chant-row .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voices{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.vdot{font-size:11px;font-weight:800;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--v-x)}
.cat-head{font-family:var(--f-display);font-style:italic;font-size:20px;color:var(--gold-ink);margin-block:22px 2px;display:flex;align-items:baseline;gap:8px}
.cat-head small{font-family:var(--f-ui);font-style:normal;font-size:13px;color:var(--muted)}

.search{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 16px}
.search input{border:0;background:transparent;flex:1;min-width:0;padding:8px 0;outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:46ch}
.notice{background:var(--gold-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px}

/* Feuilles */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-inline:16px;padding-block:0 120px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;max-width:760px;margin:0 auto;border-bottom:1px solid var(--line)}
.sheet-bar .grow{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{max-width:760px;margin:0 auto;padding-top:18px;display:flex;flex-direction:column;gap:18px}
.title-xl{font-size:clamp(28px,6.5vw,38px);font-weight:800}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:15px}
.tag{display:inline-block;background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.panel h2{font-size:20px;margin-bottom:8px}

  if(c==="invalid_argument"){canWrite=false;rerenderAll();return"Vous pouvez consulter le répertoire, mais pas le modifier. Demandez au responsable un accès Contributeur."}
  if(c==="resource_exhausted")return"Trop d'envois d'un coup. Patientez quelques secondes puis réessayez.";
  return"L'enregistrement n'a pas abouti. Vérifiez la connexion et réessayez.";
}

/* ---------- Fichiers (photos et sons) découpés dans la base ---------- */
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(blob)})}
function blobToDataURL(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}
async function saveFile(blob,name,onProg){
  const b64=await blobToB64(blob);const fid=uid();const n=Math.max(1,Math.ceil(b64.length/CHUNK));
  for(let i=0;i<n;i++){await db.doc(`files/${fid}/parts/p${String(i).padStart(4,"0")}`).set({d:b64.slice(i*CHUNK,(i+1)*CHUNK)});onProg&&onProg(i+1,n)}
  await db.doc(`files/${fid}`).set({mime:blob.type||"application/octet-stream",size:blob.size,n,name:name||""});
  return fid;
}
async function loadFile(fid){
  if(window.JAPE_STATIC)return{url:"images/"+fid+".jpg",blob:null};
  if(fileCache.has(fid))return fileCache.get(fid);
  const p=(async()=>{
    const meta=await db.doc(`files/${fid}`).get();
    if(!meta.exists)throw new Error("missing");
    const m=meta.data();
    const snap=await db.collection(`files/${fid}/parts`).limit(1000).get();
    const b64=snap.docs.map(d=>d.data().d).join("");
    const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const blob=new Blob([u],{type:m.mime});
    return {url:URL.createObjectURL(blob),blob,mime:m.mime,name:m.name};
  })();
  fileCache.set(fid,p);p.catch(()=>fileCache.delete(fid));
  return p;
}
async function deleteFile(fid){
  try{const meta=await db.doc(`files/${fid}`).get();const n=meta.exists?meta.data().n:0;
    for(let i=0;i<n;i++)await db.doc(`files/${fid}/parts/p${String(i).padStart(4,"0")}`).delete();
    await db.doc(`files/${fid}`).delete();}catch(e){}
}
async function compressImage(file,max,q){
  let src,w,h;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"});w=src.width;h=src.height}
  catch(e){src=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file)});w=src.naturalWidth;h=src.naturalHeight}
  const k=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",q));
}
async function makePhoto(file){const full=await compressImage(file,1800,.82);const th=await compressImage(file,300,.6);return{blob:full,thumb:await blobToDataURL(th),url:URL.createObjectURL(full)}}

/* ---------- Démarrage ---------- */
async function boot(){
  render();
  const c=window.claude;
  if(!c||!c.use){storeState="none";render();return}
  const [d,u]=await Promise.all([c.use("db"),c.use("user")]);
  db=d;user=u;
  if(!db){storeState="none";render();return}
  let w=null;try{w=user?await user.can("data.write"):null}catch(e){}
  canWrite=w!==false;
  storeState="ok";
  db.collection("chants").onSnapshot(s=>{S.chants=s.docs.map(x=>Object.assign({id:x.id},x.data()));S.readyC=true;rerenderAll()},()=>{storeState="err";render()});
  subBooks();subEquipe();
  db.collection("programmes").onSnapshot(s=>{S.progs=s.docs.map(x=>Object.assign({id:x.id},x.data()));S.readyP=true;rerenderAll()},()=>{});
  c.use("sample").then(s=>{sampleFn=s}).catch(()=>{});
}
function playing(el){return [...el.querySelectorAll("audio")].some(a=>!a.paused)}
const CUE=/^(intro|outro|refrain|couplet|solo|soliste|reprise|interm[eè]de|r[ée]ponse|ch[oœ]eurs?|question|introduction|direction|plusieurs|soprano|alto|t[ée]nor|basse|apr[eè]s|chor[ée]graphie)\b/i;
function lyricsHtml(t){return String(t||"").split("\n").map(l=>{const x=l.trim();if(!x)return'<span class="gap"></span>';return`<span class="${CUE.test(x)?"cue":"ln"}">${esc(x)}</span>`}).join("")}
function people(s){return String(s||"").split(/[,+;]| et /).map(x=>x.trim()).filter(Boolean)}
function rerenderAll(){render();stack.forEach(s=>s.refresh&&s.refresh())}

function fabHtml(){
  if(S.tab==="guide"||S.tab==="equipe")return"";
  if(S.tab==="prog")return`<div class="fab"><button class="btn primary" data-act="new-prog">${I.plus}Nouveau programme</button></div>`;
  return`<div class="fab"><button class="btn gold" data-act="batch">${I.cam}Ajouter par photos</button><button class="btn primary" data-act="new-chant">${I.plus}Nouveau chant</button></div>`;
}
function progCard(p){
  const [y,m,d]=(p.date||"").split("-");
  const n=(p.items||[]).length;
  return`<button class="prog ${p.date&&p.date<today()?"past":""}" data-open-prog="${esc(p.id)}">
    <div class="datebox"><div class="d">${d?Number(d):"–"}</div><div class="m">${m?MOIS[Number(m)-1]:""}</div></div>
    <div style="min-width:0"><h3>${esc(p.titre||"Sans titre")}</h3><div class="meta">${esc([p.type,p.heure,p.lieu].filter(Boolean).join(" · "))}</div><div class="meta">${n} chant${n>1?"s":""}</div></div>
    <span class="chev">${I.back.replace("M15 18l-6-6 6-6","M9 18l6-6-6-6")}</span></button>`;
}
function renderProgs(){
  if(!S.readyP)return`<div class="empty"><p>Chargement des programmes…</p></div>`;
  if(!S.progs.length)return`<div class="empty"><h3>Aucun programme pour l'instant</h3><p>Préparez le prochain culte, baptême, mariage, concert ou événement d'église : le déroulé se préremplit selon le type, vous choisissez les chants, puis vous lancez le mode prestation le jour J.</p>${canWrite?`<button class="btn primary" data-act="new-prog">${I.plus}Créer un programme</button>`:""}</div>`;
  const t=today();
  const up=S.progs.filter(p=>!p.date||p.date>=t).sort((a,b)=>(a.date||"9").localeCompare(b.date||"9"));
  const past=S.progs.filter(p=>p.date&&p.date<t).sort((a,b)=>b.date.localeCompare(a.date));
  const nx=up.find(p=>p.date);
  return`${nx?heroHtml(nx):""}${up.length?`<div class="section-label">À venir</div><div class="list">${up.map(progCard).join("")}</div>`:`<div class="notice">Aucune prestation à venir. Créez le prochain programme avec le bouton en bas.</div>`}
  ${past.length?`<div class="section-label">Passés</div><div class="list">${past.map(progCard).join("")}</div>`:""}`;
}
function heroHtml(p){
  const [y,m,d]=p.date.split("-").map(Number);const days=Math.round((new Date(y,m-1,d)-new Date(new Date().toDateString()))/864e5);
  const when=days===0?"Aujourd'hui":days===1?"Demain":"Dans "+days+" jours";
  const items=p.items||[];const titles=items.map(i=>S.chants.find(c=>c.id===i.chantId)?.titre).filter(Boolean);
  return`<section class="hero" aria-label="Prochain rendez-vous"><div class="hz"></div><div class="hb">
    <span class="ey">Prochain rendez-vous · ${esc(p.type||"")}</span><span class="when">${when}</span>
    <h2>${esc(p.titre||"Programme")}</h2>
    <div class="hm">${esc([fmtDate(p.date),p.heure,p.lieu].filter(Boolean).join(" · "))}</div>
    <div class="hm">${items.length} chant${items.length>1?"s":""}${titles.length?" · "+esc(titles.slice(0,3).join(", "))+(titles.length>3?"…":""):""}</div>
    <div class="row-actions" style="margin-top:6px">${items.length?`<button class="btn gold" data-perf-go="${esc(p.id)}">${I.stage}Lancer la prestation</button>`:""}<button class="btn hg" data-open-prog="${esc(p.id)}">Voir le déroulé</button></div>
  </div></section>`;
}
function voiceDots(c){
  const vs=[...new Set((c.sons||[]).map(s=>s.voix))];
  return vs.slice(0,5).map(v=>`<span class="vdot${v===S.maVoix?" mine":""}" style="background:${vColor(v)}" title="${esc(v)}">${esc(voix(v)[1])}</span>`).join("");
}
function chantRow(c){
  return`<button class="chant-row" data-open-chant="${esc(c.id)}">
    <span class="thumb tx" aria-hidden="true">${esc((c.titre||"?").replace(/^[^A-Za-zÀ-ÿ]+/,"").slice(0,2))}</span>
    <div class="min"><h3>${esc(c.titre||"Sans titre")}</h3><div class="meta">${esc([c.tonalite,c.tempo?("tempo "+c.tempo):"",c.style,c.solistes?("solo "+people(c.solistes).join(", ")):c.auteur].filter(Boolean).join(" · "))||"&nbsp;"}</div>${c.source==="internet"||!c.paroles?`<div class="badges">${c.source==="internet"?`<span class="badge">En ligne</span>`:""}${!c.paroles?`<span class="badge soft">À transcrire</span>`:""}</div>`:""}</div>
    <div class="voices">${voiceDots(c)}</div></button>`;
}
function myVoiceBar(){return`<div class="keys mv" role="group" aria-label="Ma voix"><span class="meta">Je chante</span>${["Soprano","Alto","Ténor","Basse"].map(v=>`<button class="chip" data-mv="${v}" aria-pressed="${S.maVoix===v}"><span class="vdot" style="background:${vColor(v)};width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:4px"></span>${v}</button>`).join("")}</div>`}
function renderChants(){
  const search=myVoiceBar()+`<div class="search"><input id="q" type="search" placeholder="Chercher un titre, un auteur, des paroles…" value="${esc(S.q)}" aria-label="Chercher un chant"></div>`;
  const cats=MOMENTS.filter(m=>S.chants.some(c=>(c.categorie||"Autre")===m));
  const chips=`<div class="chips" role="group" aria-label="Filtrer par moment"><button class="chip" aria-pressed="${!S.cat}" data-cat="">Tous</button>${cats.map(m=>`<button class="chip" aria-pressed="${S.cat===m}" data-cat="${esc(m)}">${esc(m)}</button>`).join("")}</div>`;
  if(!S.readyC)return search+`<div class="empty" style="margin-top:14px"><p>Chargement du répertoire…</p></div>`;
  if(!S.chants.length)return search+`<div class="empty" style="margin-top:14px"><h3>Le répertoire est vide</h3><p>Prenez en photo vos partitions ou feuilles de chants : Claude lit le titre, l'auteur et les paroles, puis range chaque chant dans son moment du culte.</p>${canWrite?`<div class="row-actions" style="justify-content:center"><button class="btn gold" data-act="batch">${I.cam}Classer des photos</button><button class="btn" data-act="new-chant">${I.plus}Saisir un chant</button></div>`:""}</div>`;
  const q=norm(S.q);
  let list=S.chants.filter(c=>(!S.cat||(c.categorie||"Autre")===S.cat)&&(!q||norm([c.titre,c.auteur,c.paroles,c.noms,c.categorie,c.solistes,c.style,c.direction].join(" ")).includes(q)));
  if(!list.length)return search+chips+`<div class="empty" style="margin-top:14px"><p>Aucun chant ne correspond à « ${esc(S.q)} ».</p></div>`;
  const groups=MOMENTS.map(m=>[m,list.filter(c=>(MOMENTS.includes(c.categorie)?c.categorie:"Autre")===m).sort((a,b)=>norm(a.titre).localeCompare(norm(b.titre)))]).filter(g=>g[1].length);
  return search+chips+groups.map(([m,cs])=>`<div class="cat-head">${esc(m)}<small>${cs.length}</small></div><div>${cs.map(chantRow).join("")}</div>`).join("");
}

/* ---- Note de départ, accord, gamme (synthétisés) ---- */
const NOMS=["Do","Do♯","Ré","Mi♭","Mi","Fa","Fa♯","Sol","La♭","La","Si♭","Si"];
const NIDX={do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11};
function parseKeys(t){
  const n=norm(t).replace(/♯/g,"#").replace(/♭/g,"b");const out=[];
  const re=/\b(do|re|mi|fa|sol|la|si)\b\s*(#|diese|bemol|b\b)?\s*(mineur|min\b|m\b)?/g;let m;
  while((m=re.exec(n))){let r=NIDX[m[1]];if(m[2])r=(r+(m[2]==="#"||m[2]==="diese"?1:11))%12;const minor=!!m[3];out.push({root:r,minor,label:NOMS[r]+(minor?" mineur":" majeur")})}
  return out;
}
const RANGE=[["Soprano",67,"--v-s"],["Alto",59,"--v-a"],["Ténor",52,"--v-t"],["Basse",40,"--v-b"]];
const inRange=(root,lo)=>{let m=lo-((lo%12)-root+12)%12;if(m<lo)m+=12;return m};
const noteName=m=>NOMS[m%12]+(Math.floor(m/12)-1);
let AC=null,master=null;
function playSeq(notes){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){toast("Le son n'est pas disponible sur cet appareil.");return}
  if(AC.state==="suspended")AC.resume();
  if(master){try{master.gain.setTargetAtTime(0,AC.currentTime,.02);const old=master;setTimeout(()=>old.disconnect(),300)}catch(e){}}
  master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
  const t0=AC.currentTime+.05;
  notes.forEach(([m,at,dur])=>{const f=440*Math.pow(2,(m-69)/12),st=t0+at,g=AC.createGain();
    g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.22,st+.012);g.gain.exponentialRampToValueAtTime(.0001,st+dur);g.connect(master);
    [[1,"triangle",1],[2,"sine",.3],[3,"sine",.1]].forEach(([h,ty,a])=>{const o=AC.createOscillator(),og=AC.createGain();o.type=ty;o.frequency.value=f*h;og.gain.value=a;o.connect(og);og.connect(g);o.start(st);o.stop(st+dur+.05)})});
}
function tonePanel(c,ki){
  const keys=parseKeys(c.tonalite);
  if(!keys.length)return`<h2>Donner la note</h2><p class="hint" style="margin:0">Indiquez la tonalité du chant (ex. Ré, Sol mineur) ${canWrite?"via « Modifier » ":""}pour entendre la note de chaque voix, l'accord et la gamme.</p>`;
  const k=keys[Math.min(ki,keys.length-1)];
  return`<h2>Donner la note</h2>
  ${keys.length>1?`<div class="keys" style="margin-bottom:10px"><span class="meta">Tonalité</span>${keys.map((x,i)=>`<button class="chip" aria-pressed="${i===ki}" data-key="${i}">${esc(x.label)}</button>`).join("")}</div>`:`<p class="meta" style="margin:0 0 10px">Tonalité : <b>${esc(k.label)}</b></p>`}
  <div class="tones" data-root="${k.root}" data-minor="${k.minor?1:0}">
    ${RANGE.map(([v,lo,col])=>{const m=inRange(k.root,lo);return`<button class="tone${S.maVoix===v?" mine":""}" data-tone="v" data-m="${m}"><span class="dot" style="background:var(${col})"></span><b>${v}</b><span>${noteName(m)}</span></button>`}).join("")}
    <button class="tone" data-tone="chord"><b>Accord</b><span>${esc(NOMS[k.root]+(k.minor?"m":""))} · toutes voix</span></button>
    <button class="tone" data-tone="scale"><b>Gamme</b><span>monte et redescend</span></button>
  </div>`;
}
function playTone(btn){
  const box=btn.closest(".tones");const root=Number(box.dataset.root),minor=box.dataset.minor==="1";
  $$(".tone",box).forEach(b=>b.classList.remove("on"));btn.classList.add("on");setTimeout(()=>btn.classList.remove("on"),1400);
  const kind=btn.dataset.tone;
  if(kind==="v"){const m=Number(btn.dataset.m);playSeq([[m,0,2.2]]);return}
  const a=inRange(root,59),third=minor?3:4;
  if(kind==="chord"){const ns=[inRange(root,40),a,a+third,a+7,inRange(root,67)];playSeq([...ns.map((m,i)=>[m,i*.28,1.2]),...ns.map(m=>[m,ns.length*.28+.1,2.4])]);return}
  const st=minor?[0,2,3,5,7,8,10,12]:[0,2,4,5,7,9,11,12];const seq=[...st,...st.slice(0,-1).reverse()];
  playSeq(seq.map((x,i)=>[a+x,i*.38,i===seq.length-1?1.4:.42]));
}

const pnum=v=>{if(/^\s*couv/i.test(String(v||"")))return 0;const m=String(v||"").match(/\d+/);return m?Number(m[0]):NaN};
function sortedPages(bid){return [...(G.pages[bid]||[])].sort((a,b)=>{const x=pnum(a.num),y=pnum(b.num);if(isNaN(x)&&isNaN(y))return(a.createdAt||"").localeCompare(b.createdAt||"");if(isNaN(x))return 1;if(isNaN(y))return -1;return x-y||(a.createdAt||"").localeCompare(b.createdAt||"")})}
function bookStats(bid){
  const ps=sortedPages(bid),nums=ps.map(p=>pnum(p.num)).filter(n=>!isNaN(n)&&n>0);
  const seen={},dups=new Set();nums.forEach(n=>{if(seen[n])dups.add(n);seen[n]=1});
  const miss=[];if(nums.length){for(let n=Math.min(...nums);n<=Math.max(...nums);n++)if(!seen[n])miss.push(n)}
  return{ps,min:nums.length?Math.min(...nums):null,max:nums.length?Math.max(...nums):null,dups,miss,sansNum:ps.filter(p=>isNaN(pnum(p.num))).length};
}
function ranges(a){const out=[];let s=a[0],p=a[0];for(let i=1;i<=a.length;i++){if(a[i]===p+1){p=a[i];continue}out.push(s===p?s:s+"–"+p);s=p=a[i]}return out.join(", ")}
function firstLine(t){return String(t||"").split("\n").map(x=>x.replace(/^#+\s*/,"").replace(/^\s*[-•*]\s+/,"").replace(/\s*\|\s*/g," · ").trim()).find(Boolean)||""}
function bookText(t){
  return String(t||"").split(/\n{2,}/).map(block=>{
    const lines=block.split("\n").filter(l=>l.trim());if(!lines.length)return"";
    if(lines.length>1&&lines.every(l=>l.includes(" | ")||/\|\s*$/.test(l))){const rows=lines.map(l=>l.split("|").map(c=>c.trim()));const w=Math.max(...rows.map(r=>r.length));
      return`<div class="btab"><table><thead><tr>${rows[0].map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${Array.from({length:w},(_,i)=>`<td>${esc(r[i]||"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
    if(lines.every(l=>/^\s*([-•*]|\d+[.)])\s+/.test(l)))return`<ul class="bl">${lines.map(l=>`<li>${esc(l.replace(/^\s*([-•*]|\d+[.)])\s+/,""))}</li>`).join("")}</ul>`;

  }).join("");
}
function snippet(t,q){t=String(t).replace(/^#+\s*/gm,"").replace(/^\s*[-•*]\s+/gm,"").replace(/\n+/g," ");const n=norm(t),i=n.indexOf(q);if(i<0)return esc(t.slice(0,140));const a=Math.max(0,i-60),b=Math.min(t.length,i+q.length+80);
  return(a?"…":"")+esc(t.slice(a,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length,b))+(b<t.length?"…":"")}

      ${b.incomplet?`<div class="warn" role="note"><b>Document incomplet</b><span>${esc(b.noteIncomplet||"Toutes les pages ne sont pas encore dans l'application. Vérifiez sur l'exemplaire papier avant de citer un article.")}</span></div>`:""}
      ${st.miss.length?`<div class="notice">Pas encore transcrites : p. ${ranges(st.miss)}. Ajoutez leurs photos pour compléter le guide.</div>`:""}

async function ocrPage(blob,bookTitle){
  if(!sampleFn)throw{code:"not_granted"};
  const lim=await sampleFn.limits().catch(()=>null);if(!lim||!lim.images)throw{code:"images_unavailable"};
  const prompt=`Tu reçois la photo d'UNE page du livre « ${bookTitle} » (Jeunesse de l'Église Presbytérienne Camerounaise, JAPE). Transcris-la fidèlement et réponds UNIQUEMENT avec un objet JSON :
{"numero_page": "le numéro de page IMPRIMÉ sur la page (en haut ou en bas), tel quel ; chaîne vide s'il n'est pas visible — ne le devine pas", "titre_section": "le titre du chapitre ou de la section en cours sur cette page s'il est visible, sinon vide", "texte": "tout le texte de la page dans l'ordre de lecture. Titres précédés de '## ', un paragraphe par ligne, une ligne vide entre les paragraphes, listes avec '- ' ou '1. '. Ne recopie pas le numéro de page ni l'en-tête courant répété. Corrige seulement les coupures de mots en fin de ligne, rien d'autre. N'invente rien ; écris [illisible] pour un passage illisible."}`;
  return await sampleFn.json(prompt,{images:[blob],modelTier:"default"});
}

/* Lecture des photos par Claude */
async function ocr(blobs){
  if(!sampleFn)throw{code:"not_granted"};
  const lim=await sampleFn.limits().catch(()=>null);
  if(!lim||!lim.images)throw{code:"images_unavailable"};
  const prompt=`Tu reçois ${blobs.length} photo(s) d'une partition ou d'une feuille de chant (une même œuvre, pages dans l'ordre) pour la chorale de la JAPE de l'Église Presbytérienne Camerounaise (EPC), paroisse La Grâce à Bruxelles. Les chants peuvent être en français, anglais, bulu, ewondo, duala, bassa'a ou autre langue camerounaise. Lis-les et réponds UNIQUEMENT avec un objet JSON :
{"titre": "titre du chant", "auteur": "auteur et/ou compositeur s'ils figurent", "noms": "autres noms visibles (arrangeur, éditeur, cote comme A 12-34), séparés par des virgules", "categorie": "un seul choix parmi : ${MOMENTS.join(", ")}", "langue": "langue principale du texte", "tonalite": "tonalité si elle est indiquée (Ré, Do, La…), sinon vide", "tempo": "tempo en BPM s'il est indiqué", "style": "rythme ou style indiqué (Makossa, Zouk, Bossa…)", "solistes": "prénoms des solistes indiqués, séparés par des virgules", "direction": "qui dirige, si indiqué", "paroles": "le texte tel qu'il est écrit, y compris les indications de déroulé (Intro Piano, Refrain 1 Chœur, Solo…) chacune sur sa ligne, avec une ligne vide entre les parties"}
Choisis la catégorie selon le moment du culte ou le thème le plus probable du chant (culte presbytérien) (titre, texte, indication sur la feuille). Mets une chaîne vide pour tout champ illisible ou absent. N'invente rien.`;
  return await sampleFn.json(prompt,{images:blobs.slice(0,lim.images.maxCount||4),modelTier:"default"});
}
function ocrErr(e){const c=e&&e.code;
  if(c==="not_granted")return"La lecture par Claude n'est pas autorisée sur cette page. Remplissez les champs à la main.";
  if(c==="images_unavailable")return"La lecture de photos n'est pas disponible ici. Remplissez les champs à la main.";
  if(c==="rate_limited")return"Trop de lectures d'affilée. Réessayez dans une minute.";
  if(c==="image_rejected")return"Claude n'a pas pu ouvrir cette photo. Essayez une autre prise de vue.";
  return"La lecture n'a pas abouti. Réessayez, ou remplissez les champs à la main.";}

function showText(txt){const bg=document.createElement("div");bg.className="modal-bg";bg.innerHTML=`<div class="modal"><h2>Copiez le texte</h2><textarea class="sel" style="min-height:220px" readonly>${esc(txt)}</textarea><div class="row-actions"><button class="btn primary" data-a>Fermer</button></div></div>`;document.body.appendChild(bg);const ta=$("textarea",bg);ta.focus();ta.select();bg.onclick=e=>{if(e.target===bg||e.target.closest("[data-a]"))bg.remove()}}

/* Édition d'un programme */
function openProgEdit(id,copyFrom){
  const p=id?S.progs.find(x=>x.id===id):null;const src=p||copyFrom;
  const d={titre:"",date:"",heure:"",lieu:"EPC Paroisse La Grâce, Bruxelles",type:"Culte dominical",direction:"",notes:"",items:[]};
  if(src)Object.assign(d,JSON.parse(JSON.stringify({titre:src.titre,date:src.date,heure:src.heure,lieu:src.lieu,type:src.type,direction:src.direction,notes:src.notes,items:src.items||[]})));
  if(copyFrom){d.titre=(d.titre||"")+" (copie)";d.date=""}
  if(!src)d.items=TPL["Culte dominical"].map(m=>({moment:m,chantId:""}));
  let busy=false;
  const chantOptions=sel=>{const groups=MOMENTS.map(m=>[m,S.chants.filter(c=>(MOMENTS.includes(c.categorie)?c.categorie:"Autre")===m).sort((a,b)=>norm(a.titre).localeCompare(norm(b.titre)))]).filter(g=>g[1].length);
    return`<option value="">— Choisir un chant —</option>`+groups.map(([m,cs])=>`<optgroup label="${esc(m)}">${cs.map(c=>`<option value="${esc(c.id)}" ${c.id===sel?"selected":""}>${esc(c.titre)}</option>`).join("")}</optgroup>`).join("")};
  const sh={type:"prog-edit",draw(){
    this.el.innerHTML=bar(id?"Modifier le programme":"Nouveau programme",`<button class="btn sm primary" data-save>Enregistrer</button>`)+
    `<div class="sheet-body"><form novalidate>
      <label class="f">Titre<input id="p-titre" value="${esc(d.titre)}" placeholder="Ex. 27e dimanche du temps ordinaire"></label>
      <div class="grid2">
        <label class="f">Date<input id="p-date" type="date" value="${esc(d.date)}"></label>
        <label class="f">Heure<input id="p-heure" type="time" value="${esc(d.heure)}"></label>
        <label class="f">Type<select id="p-type">${TYPES.map(t=>`<option ${d.type===t?"selected":""}>${esc(t)}</option>`).join("")}</select></label>
        <label class="f">Lieu<input id="p-lieu" value="${esc(d.lieu)}"></label>
      </div>
      <label class="f">Direction / animation<input id="p-dir" value="${esc(d.direction)}" placeholder="Qui dirige ce jour-là"></label>
      <div class="panel" style="display:flex;flex-direction:column;gap:10px"><h2 style="margin:0">Déroulé des chants</h2>
        ${S.chants.length?"":`<p class="hint" style="margin:0">Le répertoire est vide : ajoutez d'abord des chants, puis revenez les choisir ici. Vous pouvez déjà préparer les moments.</p>`}
        <div id="its" style="display:flex;flex-direction:column;gap:8px">${d.items.map((it,i)=>`<div class="edit-row" data-i="${i}"><div class="fields"><select class="sel" data-f="moment" aria-label="Moment ${i+1}">${MOMENTS.map(m=>`<option ${it.moment===m?"selected":""}>${esc(m)}</option>`).join("")}</select><select class="sel" data-f="chantId" aria-label="Chant ${i+1}">${chantOptions(it.chantId)}</select></div><div class="btns"><button type="button" class="mini" data-up="${i}" aria-label="Monter">↑</button><button type="button" class="mini" data-down="${i}" aria-label="Descendre">↓</button><button type="button" class="mini" data-rm="${i}" aria-label="Retirer">×</button></div></div>`).join("")}</div>
        <button type="button" class="btn sm" data-add-item style="align-self:flex-start">${I.plus}Ajouter un moment</button>
      </div>
      <label class="f">Consignes pour la chorale<textarea id="p-notes" style="min-height:90px;font-family:var(--f-ui);font-size:16px" placeholder="Heure du rendez-vous, tenue, répétition…">${esc(d.notes)}</textarea></label>
      <button type="button" class="btn primary" data-save>Enregistrer le programme</button>
    </form></div>`;
  }};
  const read=()=>{const el=sh.el;d.titre=$("#p-titre",el).value.trim();d.date=$("#p-date",el).value;d.heure=$("#p-heure",el).value;d.type=$("#p-type",el).value;d.lieu=$("#p-lieu",el).value.trim();d.direction=$("#p-dir",el).value.trim();d.notes=$("#p-notes",el).value;
    $$("#its .edit-row",el).forEach(r=>{const i=Number(r.dataset.i);d.items[i]={moment:$("[data-f=moment]",r).value,chantId:$("[data-f=chantId]",r).value}})};
  openSheet(sh);
  sh.el.addEventListener("change",e=>{if(e.target.id==="p-type"){read();if(d.items.every(i=>!i.chantId)){d.items=(TPL[d.type]||TPL.Autre).map(m=>({moment:m,chantId:""}));sh.draw();toast("Déroulé « "+d.type+" » préparé")}return}const s=e.target.closest("[data-f=chantId]");if(s&&s.value){const row=s.closest(".edit-row");const c=S.chants.find(x=>x.id===s.value);const m=$("[data-f=moment]",row);if(c&&MOMENTS.includes(c.categorie)&&m.value==="Autre")m.value=c.categorie}});
  sh.el.addEventListener("click",async e=>{
    const t=e.target;let k;
    if(t.closest("[data-add-item]")){read();d.items.push({moment:"Autre",chantId:""});sh.draw();$$("#its .edit-row",sh.el).pop()?.scrollIntoView({block:"center"});return}
    if((k=t.closest("[data-up]"))){read();const i=Number(k.dataset.up);if(i>0){[d.items[i-1],d.items[i]]=[d.items[i],d.items[i-1]];sh.draw()}return}
    if((k=t.closest("[data-down]"))){read();const i=Number(k.dataset.down);if(i<d.items.length-1){[d.items[i+1],d.items[i]]=[d.items[i],d.items[i+1]];sh.draw()}return}
    if((k=t.closest("[data-rm]"))){read();d.items.splice(Number(k.dataset.rm),1);sh.draw();return}
    if(t.closest("[data-save]")){
      if(busy)return;read();
      if(!d.titre){d.titre=(d.type||"Programme")+(d.date?" du "+fmtDate(d.date):"")}
      busy=true;$$("[data-save]",sh.el).forEach(b=>b.disabled=true);
      try{const pid=id||uid();await db.doc("programmes/"+pid).set(Object.assign({},d,{updatedAt:new Date().toISOString()}));closeSheet(sh);toast("Programme enregistré");if(!id)openProg(pid)}
      catch(err){busy=false;$$("[data-save]",sh.el).forEach(b=>b.disabled=false);toast(dbErr(err),4200)}
    }
  });
}

/* Mode prestation */
function openPerf(pid){
  let idx=0,size=ls.get("perfSize",24),lock=null;
  const getLock=async()=>{try{lock=await navigator.wakeLock?.request("screen")}catch(e){}};
  const vis=()=>{if(document.visibilityState==="visible")getLock()};
  const sh={type:"perf",cls:"perf",draw(){
    const p=S.progs.find(x=>x.id===pid);if(!p){closeSheet(this);return}
    const items=p.items||[];if(idx>=items.length)idx=Math.max(0,items.length-1);
    const it=items[idx]||{};const c=S.chants.find(x=>x.id===it.chantId);const nx=items[idx+1];const nc=nx&&S.chants.find(x=>x.id===nx.chantId);
    this.el.style.setProperty("--psize",size+"px");
    this.el.innerHTML=`<div class="sheet-bar"><button class="icon-btn" data-close aria-label="Quitter la prestation">${I.x}</button><div class="grow">${esc(p.titre||"Prestation")}</div><span class="count">${idx+1} / ${items.length}</span><button class="icon-btn" data-sz="-1" aria-label="Texte plus petit" style="font-weight:800">A−</button><button class="icon-btn" data-sz="1" aria-label="Texte plus grand" style="font-weight:800">A+</button></div>
    <div class="pbody"><div class="pmom">${esc(it.moment||"")}</div><h1 class="ptitle">${c?esc(c.titre):"Chant à choisir"}</h1>
    ${c?`<div class="kv">${c.tonalite?`<span>Tonalité : <b>${esc(c.tonalite)}</b></span>`:""}${c.tempo?`<span>Tempo <b>${esc(c.tempo)}</b></span>`:""}${c.style?`<span>${esc(c.style)}</span>`:""}</div>${whoHtml(c)}${chantBody(c,true)}`:`<div class="empty"><p>Aucun chant n'est choisi pour ce moment.</p></div>`}
    </div>
    <nav class="pnav"><div class="in"><button class="btn" data-prev ${idx===0?"disabled":""}>${I.back}Précédent</button><div class="next">${nx?`Ensuite · ${esc(nx.moment)}<b>${nc?esc(nc.titre):"—"}</b>`:"<b>Dernier chant</b>"}</div><button class="btn primary" data-next ${idx>=items.length-1?"disabled":""}>Suivant<span style="transform:scaleX(-1);display:inline-flex">${I.back}</span></button></div></nav>`;
    this.el.onclick=null;if(c)hydrateChant(this.el,c);
    const self=this;const prevClick=this.el.onclick;
    this.el.onclick=e=>{
      if(e.target.closest("[data-prev]")){idx=Math.max(0,idx-1);self.draw();self.el.scrollTop=0;return}
      if(e.target.closest("[data-next]")){idx=Math.min(items.length-1,idx+1);self.draw();self.el.scrollTop=0;return}
      const sz=e.target.closest("[data-sz]");if(sz){size=Math.min(44,Math.max(16,size+2*Number(sz.dataset.sz)));ls.set("perfSize",size);self.el.style.setProperty("--psize",size+"px");return}
      prevClick&&prevClick(e);
    };
  },refresh(){if(!playing(this.el))this.draw()},onClose(){try{lock&&lock.release()}catch(e){}document.removeEventListener("visibilitychange",vis)}};
  openSheet(sh);getLock();document.addEventListener("visibilitychange",vis);
  sh.keys=e=>{if(e.key==="ArrowRight")$("[data-next]",sh.el)?.click();if(e.key==="ArrowLeft")$("[data-prev]",sh.el)?.click()};
}

/* ---------- Événements globaux ---------- */
document.addEventListener("click",async e=>{
  const t=e.target;let k;
  if(t.closest("[data-close]")){const sh=stack.find(s=>s.el.contains(t));closeSheet(sh);return}
  if((k=t.closest("[data-tab]"))){S.tab=k.dataset.tab;ls.set("tab2",S.tab);render();return}
  if((k=t.closest("[data-cat]"))&&!k.closest(".sheet")){S.cat=k.dataset.cat;render();return}
  if((k=t.closest("[data-open-chant]"))){openChant(k.dataset.openChant);return}
  if((k=t.closest("[data-open-prog]"))){openProg(k.dataset.openProg);return}
  if((k=t.closest("[data-rec]"))){openRecAdd(k.dataset.rec);return}
  if((k=t.closest("[data-lsz]"))){const v=Math.min(32,Math.max(16,(ls.get("lyrSize",20))+2*Number(k.dataset.lsz)));ls.set("lyrSize",v);document.documentElement.style.setProperty("--lsize",v+"px");return}
  if((k=t.closest("[data-lyr]"))){openLyrics(k.dataset.lyr);return}
  if(t.closest("[data-cadd]")){openMember(null);return}
  if((k=t.closest("[data-cedit]"))){openMember(k.dataset.cedit);return}
  if((k=t.closest("[data-solpick]"))){const i=$("#f-sol");if(i){const n=k.dataset.solpick;let l=people(i.value);l=l.some(x=>norm(x)===norm(n))?l.filter(x=>norm(x)!==norm(n)):[...l,n];i.value=l.join(", ");k.setAttribute("aria-pressed",l.some(x=>norm(x)===norm(n)))}return}
  if((k=t.closest("[data-gpage]"))){const [b,p]=k.dataset.gpage.split("|");openGuidePage(b,p);return}
  if((k=t.closest("[data-gadd]"))){openGuideAdd(k.dataset.gadd);return}
  if((k=t.closest("[data-perf-go]"))){openPerf(k.dataset.perfGo);return}
  if((k=t.closest("[data-mv]"))){S.maVoix=S.maVoix===k.dataset.mv?"":k.dataset.mv;ls.set("maVoix",S.maVoix);rerenderAll();toast(S.maVoix?"Votre voix : "+S.maVoix:"Voix non précisée");return}
  if((k=t.closest("[data-edit-chant]"))){openChantEdit(k.dataset.editChant);return}
  if((k=t.closest("[data-edit-prog]"))){openProgEdit(k.dataset.editProg);return}
  if((k=t.closest("[data-dup-prog]"))){const p=S.progs.find(x=>x.id===k.dataset.dupProg);if(p)openProgEdit(null,p);return}
  if((k=t.closest("[data-del-chant]"))){
    const c=S.chants.find(x=>x.id===k.dataset.delChant);if(!c)return;
    const used=S.progs.filter(p=>(p.items||[]).some(i=>i.chantId===c.id)).length;
    if(await confirmBox("Supprimer « "+(c.titre||"ce chant")+" » ?",`Ses photos et ses sons seront effacés pour toute la chorale.${used?` Il apparaît dans ${used} programme${used>1?"s":""}, où il deviendra « Chant à choisir ».`:""}`)){
      try{await db.doc("chants/"+c.id).delete();closeSheet(stack.find(s=>s.el.contains(k)));[...(c.photos||[]),...(c.sons||[])].forEach(x=>x.f&&deleteFile(x.f));toast("Chant supprimé")}catch(err){toast(dbErr(err),4200)}}
    return}
  if((k=t.closest("[data-del-prog]"))){
    const p=S.progs.find(x=>x.id===k.dataset.delProg);if(!p)return;
    if(await confirmBox("Supprimer ce programme ?","Les chants restent dans le répertoire.")){try{await db.doc("programmes/"+p.id).delete();closeSheet(stack.find(s=>s.el.contains(k)));toast("Programme supprimé")}catch(err){toast(dbErr(err),4200)}}
    return}
  if(t.closest("[data-act=new-prog]")){openProgEdit(null);return}
  if(t.closest("[data-act=new-chant]")){openChantEdit(null);return}
  if(t.closest("[data-act=batch]")){const i=$("#pick-batch");i.value="";i.onchange=()=>{if(i.files.length)openBatch([...i.files])};i.click();return}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;S._focusQ=true;render();S._focusQ=false}if(e.target.id==="gq"){G.q=e.target.value;render();const g=$("#gq");if(g){g.focus();g.setSelectionRange(g.value.length,g.value.length)}}});
document.addEventListener("keydown",e=>{
  if(document.querySelector(".viewer,.modal-bg"))return;
  const top=stack[stack.length-1];
  if(e.key==="Escape"&&top){closeSheet(top);return}
  if(top&&top.keys&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))top.keys(e);
});

document.documentElement.style.setProperty("--lsize",ls.get("lyrSize",20)+"px");
boot();
})();
</script>
